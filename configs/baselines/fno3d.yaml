model:
  name: fno3d
  modes1: 12
  modes2: 12
  # The pinned upstream FNO3d class fixes the temporal mode count to 4.
  modes3: 4
  width: 24
  include_roughness: true
training:
  checkpoint_selection_metric: development_event_macro_physical_h_rmse
  validation_query_chunk: 32768
  seeds: [7, 31, 42]
  max_epochs: 100
  patience: 50
  micro_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
data:
  input_channels: 31
  output_channels: 72
  forecast_leads: 24
  output_variables: [H, U, V]
